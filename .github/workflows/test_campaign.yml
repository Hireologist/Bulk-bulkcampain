name: 🩺 Campaign Health & Pre-Flight Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-diagnostics:
    name: 🔍 Pre-Flight Campaign Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute Campaign Pre-Flight Audit
        run: node scripts/test-campaign-diagnostics.mjs
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
