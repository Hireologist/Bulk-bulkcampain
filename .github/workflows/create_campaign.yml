name: ➕ Create New Campaign (Auto-Sheet & Workflow)
run-name: "➕ Create Campaign: [${{ inputs.campaign_name }}]"

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      campaign_name:
        description: 'Campaign Name (e.g. "US Tech Recruiting" or "SaaS Founders")'
        required: true
        default: 'New Campaign'
      existing_sheet_id:
        description: 'Existing Raw Google Sheet ID (leave blank to auto-create a brand new Sheet)'
        required: false
      user_email:
        description: 'Your Google Email to share Editor access directly (optional)'
        required: false
      make_public:
        description: 'Make Google Sheet Public with Edit Access'
        required: true
        default: true
        type: boolean
      github_pat:
        description: 'GitHub PAT with workflow scope (Optional if secret PAT_GITHUB is set)'
        required: false
        type: string
      cron_api_key:
        description: 'cron-job.org API Key (Optional if secret CRON_API_KEY is set)'
        required: false
        type: string

jobs:
  create-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ inputs.github_pat || secrets.PAT_GITHUB || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Provision Google Sheet & Dedicated Workflow
        run: |
          node scripts/create-new-campaign.mjs \
            --name "${{ inputs.campaign_name }}" \
            ${{ inputs.existing_sheet_id && format('--sheet-id "{0}"', inputs.existing_sheet_id) || '' }} \
            --email "${{ inputs.user_email }}" \
            ${{ inputs.make_public && '' || '--private' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CRON_API_KEY: ${{ inputs.cron_api_key || secrets.CRON_API_KEY || secrets.CRON_KEY }}
          GITHUB_PAT: ${{ inputs.github_pat || secrets.PAT_GITHUB || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PAT }}

      - name: Commit & Push New Campaign Workflow to GitHub
        env:
          PAT_TOKEN: ${{ inputs.github_pat || secrets.PAT_GITHUB || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/outreach_*.yml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(campaign): add dedicated workflow for [${{ inputs.campaign_name }}]"
            if [ -n "$PAT_TOKEN" ]; then
              echo "🚀 Pushing new workflow to GitHub repository using GitHub PAT..."
              git push "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
            else
              echo "::error::GitHub requires a Personal Access Token (PAT) with 'workflow' scope to commit new workflow files into .github/workflows/."
              echo "::error::Please add 'PAT_GITHUB' to your repository Secrets (Settings > Secrets and variables > Actions), or supply it in the workflow inputs."
              exit 1
            fi
          fi
