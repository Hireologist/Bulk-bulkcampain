name: Universal Outreach Engine

concurrency:
  # This dynamic group allows Inbox and Outreach to run at the same time.
  # If a second Inbox check starts while one is still running, it cancels the old one.
  group: outreach-${{ github.event.schedule || github.event.inputs.action || 'manual' }}
  cancel-in-progress: true

on:
  schedule:
    # 1. Cold Outreach: Mon-Sat at 10:00 AM IST (04:30 UTC)
    - cron: '30 4 * * 1-6'
    
    # 2. Follow-Up Engine: Mon-Sat at 10:30 AM IST (05:00 UTC)
    - cron: '0 5 * * 1-6'
    
    # 3. Inbox Checker: 24/7 every 30 minutes
    - cron: '*/30 * * * *'

    # 4. Daily Digest Summary: Mon-Sat at 6:30 PM IST (13:00 UTC)
    - cron: '0 13 * * 1-6'

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose task to run manually'
        required: true
        default: 'inbox'
        type: choice
        options:
          - outreach
          - followup
          - inbox
          - digest

jobs:
  run-engine:
    runs-on: ubuntu-latest
    # Safety: stops the job if it hangs for more than 15 minutes
    timeout-minutes: 15 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Engine Task
        env:
          # Your essential secrets
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Environment variables for logic
          SCHEDULED_CRON: ${{ github.event.schedule }}
          SELECTED_ACTION: ${{ github.event.inputs.action }}
        run: |
          echo "Trigger Source: ${{ github.event_name }}"
          echo "Cron string detected: $SCHEDULED_CRON"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running manual action: $SELECTED_ACTION"
            node engine.mjs "$SELECTED_ACTION"

          elif [ "$SCHEDULED_CRON" = "30 4 * * 1-6" ]; then
            echo "Running Scheduled Cold Outreach..."
            node engine.mjs outreach

          elif [ "$SCHEDULED_CRON" = "0 5 * * 1-6" ]; then
            echo "Running Scheduled Follow-up..."
            node engine.mjs followup

          elif [ "$SCHEDULED_CRON" = "0 13 * * 1-6" ]; then
            echo "Running Scheduled Daily Digest..."
            node engine.mjs digest

          else
            echo "Running Scheduled Inbox Check..."
            node engine.mjs inbox
          fi
