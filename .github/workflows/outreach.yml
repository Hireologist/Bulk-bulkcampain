name: Universal Outreach Engine

# Prevents multiple jobs from colliding on the Google Sheet
concurrency:
  group: outreach-single-lane
  cancel-in-progress: false

on:
  schedule:
    # 1. Follow-Up Engine: Mon-Sat at 09:30 AM IST (04:00 UTC) - Runs first (~15 mins)
    - cron: '0 4 * * 1-6'
    
    # 2. Cold Outreach: Mon-Sat at 10:00 AM IST (04:30 UTC) - Long running
    - cron: '30 4 * * 1-6'
    
    # 3. Daily Digest: Mon-Sat at 06:30 PM IST (13:00 UTC) - Summary report
    - cron: '0 13 * * 1-6'
    
    # 4. Inbox Checker: 24/7 every 30 minutes
    - cron: '*/30 * * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose task to run manually'
        required: true
        default: 'inbox'
        type: choice
        options: [outreach, followup, inbox, digest]

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6-hour execution window

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Engine Task
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
          SELECTED_ACTION: ${{ github.event.inputs.action }}
        run: |
          echo "Trigger Source: ${{ github.event_name }}"
          echo "Schedule: $SCHEDULED_CRON"

          # 1. Manual Trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running Manual Action: $SELECTED_ACTION"
            node engine.mjs "$SELECTED_ACTION"

          # 2. Follow-Up Engine (Runs first at 9:30 AM IST)
          elif [ "$SCHEDULED_CRON" = "0 4 * * 1-6" ]; then
            echo "Starting Follow-up Engine..."
            node engine.mjs followup

          # 3. Cold Outreach (Starts at 10:00 AM IST)
          elif [ "$SCHEDULED_CRON" = "30 4 * * 1-6" ]; then
            echo "Starting Cold Outreach..."
            node engine.mjs outreach

          # 4. Daily Digest (06:30 PM IST)
          elif [ "$SCHEDULED_CRON" = "0 13 * * 1-6" ]; then
            echo "Generating Daily Digest..."
            node engine.mjs digest

          # 5. Inbox Checker (Every 30 Mins 24/7)
          else
            echo "Running Inbox Checker..."
            node engine.mjs inbox
          fi
