name: Universal Outreach Engine

# 🎯 4 EXPLICIT INDEPENDENT LANES (Zero collisions, no shared queues)
concurrency:
  group: ${{ 
    (github.event.schedule == '*/30 * * * *' || github.event.inputs.action == 'inbox')    && 'inbox-lane' ||
    (github.event.schedule == '0 4 * * 1-6'   || github.event.inputs.action == 'followup') && 'followup-lane' ||
    (github.event.schedule == '0 13 * * 1-6'  || github.event.inputs.action == 'digest')   && 'digest-lane' ||
    'outreach-lane'
  }}
  # Only cancel if a new 30-min inbox check arrives while an old one is hanging
  cancel-in-progress: ${{ github.event.schedule == '*/30 * * * *' || github.event.inputs.action == 'inbox' }}

permissions:
  contents: read

on:
  schedule:
    - cron: '0 4 * * 1-6'     # 1. Follow-up Engine (09:30 AM IST) -> followup-lane
    - cron: '30 4 * * 1-6'    # 2. Cold Outreach (10:00 AM IST)    -> outreach-lane
    - cron: '0 13 * * 1-6'    # 3. Daily Digest (06:30 PM IST)     -> digest-lane
    - cron: '*/30 * * * *'    # 4. Inbox Checker (Every 30 mins)   -> inbox-lane

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose task to run manually'
        required: true
        default: 'inbox'
        type: choice
        options: [outreach, followup, inbox, digest]

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SCHEDULED_CRON: ${{ github.event.schedule }}
      SELECTED_ACTION: ${{ github.event.inputs.action }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (with cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Validate required secrets
        run: |
          set -eu
          if [ -z "${SPREADSHEET_ID:-}" ]; then
            echo "ERROR: SPREADSHEET_ID is not set" >&2
            exit 1
          fi
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is not set" >&2
            exit 1
          fi

      - name: Write service account key
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/gsa.json
          chmod 600 /tmp/gsa.json

      - name: Install Dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Run Engine Task
        run: |
          set -euo pipefail

          echo "Trigger: ${{ github.event_name }} | Cron: $SCHEDULED_CRON | Action: $SELECTED_ACTION"

          # 1. Manual Trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node engine.mjs "$SELECTED_ACTION"

          # 2. Follow-Up Engine (09:30 AM IST)
          elif [ "$SCHEDULED_CRON" = "0 4 * * 1-6" ]; then
            node engine.mjs followup

          # 3. Cold Outreach (10:00 AM IST)
          elif [ "$SCHEDULED_CRON" = "30 4 * * 1-6" ]; then
            node engine.mjs outreach

          # 4. Daily Digest (06:30 PM IST)
          elif [ "$SCHEDULED_CRON" = "0 13 * * 1-6" ]; then
            node engine.mjs digest

          # 5. Inbox Checker (Every 30 Mins 24/7)
          elif [ "$SCHEDULED_CRON" = "*/30 * * * *" ]; then
            node engine.mjs inbox
            
          else
            echo "Unknown trigger. Defaulting to inbox check."
            node engine.mjs inbox
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
