name: Universal Outreach Engine

concurrency:
  group: outreach-${{ github.event.schedule || github.event.inputs.action || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

on:
  schedule:
    - cron: '0 4 * * 1-6'     # 1. Follow-up Engine (09:30 AM IST)
    - cron: '30 4 * * 1-6'    # 2. Cold Outreach (10:00 AM IST)
    - cron: '0 13 * * 1-6'    # 3. Daily Digest (06:30 PM IST)
    - cron: '7,22,37,52 * * * *'    # 4. Inbox Checker (Every 15 mins off-peak)

  repository_dispatch:
    types: [send_single_email]

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose task to run manually'
        required: true
        default: 'inbox'
        type: choice
        options: [outreach, followup, inbox, digest, single_lead]
      email:
        description: 'Recipient Email (for single_lead)'
        required: false
      full_name:
        description: 'Recipient Full Name (for single_lead)'
        required: false
      company_name:
        description: 'Recipient Company Name (for single_lead)'
        required: false
      location:
        description: 'Recipient Location (for single_lead)'
        required: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SCHEDULED_CRON: ${{ github.event.schedule }}
      SELECTED_ACTION: ${{ github.event.inputs.action }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (with cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Validate required secrets
        run: |
          set -eu
          if [ -z "${SPREADSHEET_ID:-}" ]; then
            echo "ERROR: SPREADSHEET_ID is not set" >&2
            exit 1
          fi
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is not set" >&2
            exit 1
          fi

      - name: Write service account key
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/gsa.json
          chmod 600 /tmp/gsa.json

      - name: Install Dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Run Engine Task
        run: |
          set -euo pipefail

          echo "Trigger: ${{ github.event_name }} | Cron: $SCHEDULED_CRON | Action: $SELECTED_ACTION"

          # 1. Webhook Repository Dispatch (Single / Bulk Remote Trigger)
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Running Remote Dispatch from Repository Webhook..."
            export SINGLE_EMAIL="${{ github.event.client_payload.email }}"
            export SINGLE_NAME="${{ github.event.client_payload.full_name || github.event.client_payload.personName }}"
            export SINGLE_COMPANY="${{ github.event.client_payload.company_name || github.event.client_payload.companyName }}"
            export SINGLE_LOCATION="${{ github.event.client_payload.location }}"
            export SINGLE_SHEET_ID="${{ github.event.client_payload.spreadsheet_id || github.event.client_payload.sheet_id }}"
            export SINGLE_WEBHOOK_URL="${{ github.event.client_payload.webhook_url || github.event.client_payload.discord_webhook }}"
            export SINGLE_LEADS_JSON='${{ toJson(github.event.client_payload.leads) }}'
            node engine.mjs single_lead

          # 2. Manual Workflow Dispatch Trigger
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running Manual Action: $SELECTED_ACTION"
            if [ "$SELECTED_ACTION" = "single_lead" ]; then
              export SINGLE_EMAIL="${{ github.event.inputs.email }}"
              export SINGLE_NAME="${{ github.event.inputs.full_name }}"
              export SINGLE_COMPANY="${{ github.event.inputs.company_name }}"
              export SINGLE_LOCATION="${{ github.event.inputs.location }}"
            fi
            node engine.mjs "$SELECTED_ACTION"

          # 3. Follow-Up Engine (09:30 AM IST)
          elif [ "$SCHEDULED_CRON" = "0 4 * * 1-6" ]; then
            echo "Starting Follow-up Engine..."
            node engine.mjs followup

          # 4. Cold Outreach (10:00 AM IST)
          elif [ "$SCHEDULED_CRON" = "30 4 * * 1-6" ]; then
            echo "Starting Cold Outreach..."
            node engine.mjs outreach

          # 5. Daily Digest (06:30 PM IST)
          elif [ "$SCHEDULED_CRON" = "0 13 * * 1-6" ]; then
            echo "Generating Daily Digest..."
            node engine.mjs digest

          # 6. Inbox Checker (Every 15 Mins Off-Peak)
          elif [ "$SCHEDULED_CRON" = "7,22,37,52 * * * *" ]; then
            echo "Running Inbox Checker..."
            node engine.mjs inbox
            
          else
            echo "Unknown trigger. Defaulting to inbox check."
            node engine.mjs inbox
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
