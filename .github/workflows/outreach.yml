name: Universal Outreach Engine

concurrency:
  group: outreach-engine
  cancel-in-progress: false

on:
  schedule:
    # 1. Cold Outreach: Mon-Sat at 10:00 AM IST (04:30 UTC)
    - cron: '30 4 * * 1-6'
    
    # 2. Follow-Up Engine: Mon-Sat at 10:30 AM IST (05:00 UTC)
    - cron: '0 5 * * 1-6'
    
    # 3. Inbox Checker: 24/7 every 30 minutes
    - cron: '*/30 * * * *'

    # 4. Daily Digest Summary: Mon-Sat at 6:30 PM IST (13:00 UTC)
    - cron: '0 13 * * 1-6'

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose task to run manually'
        required: true
        default: 'digest'
        type: choice
        options:
          - outreach
          - followup
          - inbox
          - digest

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Use 22 (LTS) for better stability
      
      - run: npm install

      - name: Run Selected Task
        env:
          SCHEDULED_CRON: ${{ github.event.schedule }}
          SELECTED_ACTION: ${{ github.event.inputs.action }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Triggered Schedule: $SCHEDULED_CRON"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running manual action: $SELECTED_ACTION"
            node engine.mjs "$SELECTED_ACTION"

          elif [ "$SCHEDULED_CRON" = "30 4 * * 1-6" ]; then
            echo "Running Scheduled Outreach..."
            node engine.mjs outreach

          elif [ "$SCHEDULED_CRON" = "0 5 * * 1-6" ]; then
            echo "Running Scheduled Follow-up..."
            node engine.mjs followup

          elif [ "$SCHEDULED_CRON" = "0 13 * * 1-6" ]; then
            echo "Running Scheduled Digest..."
            node engine.mjs digest

          else
            echo "Defaulting to Inbox Check..."
            node engine.mjs inbox
          fi
